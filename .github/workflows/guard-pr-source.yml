name: Guard PR source branch

on:
  pull_request:
    branches:
      - test
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce promotion graph
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          if [[ "$base" == "test" && "$head" != "dev" ]]; then
            echo "PRs into test must come from dev. Got: $head"
            exit 1
          fi
          if [[ "$base" == "main" && "$head" != "test" ]]; then
            echo "PRs into main must come from test. Got: $head"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate runtime data-source condition references
        shell: bash
        run: |
          node tools/runtime-data-source-condition-guard.mjs --draft-root=. --domain=zoositioweb.com.mx
